{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Smart Expense Tracker</title>

    <link rel="stylesheet" href="{% static 'expenses/style.css' %}">

    <style>
        .auth-container {
            background-color: white;
            max-width: 450px;
            margin: 60px auto;
            padding: 35px;
            border-radius: 10px;
        }

        .auth-container h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-container p {
            margin-bottom: 18px;
        }

        .auth-container input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .login-button {
            width: 100%;
            background-color: #2980b9;
            color: white;
            margin-top: 10px;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
        }

        .signup-link a {
            color: #2980b9;
            text-decoration: none;
        }
    </style>

</head>

<body>

    <div class="header">

        <h1>Smart Expense Tracker</h1>

    </div>

    <div class="auth-container">

        <h2>🔐 Login</h2>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button class="login-button" type="submit">
                Login
            </button>

        </form>

        <div class="signup-link">

            <p>
                Don't have an account?
                <a href="{% url 'signup' %}">Create an account</a>
            </p>

        </div>

    </div>

</body>

</html>
