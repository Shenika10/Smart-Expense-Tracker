{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Expense - Smart Expense Tracker</title>

    <link rel="stylesheet" href="{% static 'expenses/style.css' %}">

    <style>
        .delete-container {
            background-color: white;
            max-width: 550px;
            margin: 60px auto;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

        .delete-container h2 {
            color: #e74c3c;
        }

        .expense-details {
            background-color: #f8f9fa;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
            text-align: left;
        }

        .delete-button {
            background-color: #e74c3c;
            color: white;
            margin-right: 10px;
        }

        .cancel-button {
            display: inline-block;
            color: #2980b9;
            text-decoration: none;
            padding: 10px 18px;
        }
    </style>

</head>

<body>

    <div class="header">

        <h1>Smart Expense Tracker</h1>

        <a class="logout" href="{% url 'logout' %}">
            Logout
        </a>

    </div>

    <div class="delete-container">

        <h2>🗑️ Delete Expense</h2>

        <p>
            Are you sure you want to delete this expense?
        </p>

        <div class="expense-details">

            <p>
                <strong>Description:</strong>
                {{ expense.description }}
            </p>

            <p>
                <strong>Amount:</strong>
                ₹{{ expense.amount }}
            </p>

            <p>
                <strong>Category:</strong>
                {{ expense.category }}
            </p>

        </div>

        <form method="POST">

            {% csrf_token %}

            <button class="delete-button" type="submit">
                Yes, Delete
            </button>

            <a class="cancel-button" href="{% url 'dashboard' %}">
                Cancel
            </a>

        </form>

    </div>

</body>

</html>
